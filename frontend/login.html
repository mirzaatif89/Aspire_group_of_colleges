<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aspire College Jand</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="style.css?v=20260814-centered-school-name">
    <!-- Real-Time SQL Sync -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="school-theme.css?v=20261108-login-campus-center">
    <script src="school-branding.js?v=20260924"></script>
</head>

<body>

    <div class="login-layout">
        <div class="login-card">

            <!-- New Single Column Design -->
            <div class="login-header">
                <div class="login-icon-circle">
                    <img class="login-school-logo" src="images/logo.png"
                        alt="Aspire College Jand logo">
                    <span class="login-school-name"><strong>Aspire College</strong><span class="login-campus-name">Jand</span></span>
                </div>
            </div>

            <div class="login-body">
                <form id="loginForm">
                    <div class="input-group">
                        <label for="email">Username / Email</label>
                        <div style="position: relative;">
                            <input type="text" id="email" placeholder="Enter username or email" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="password-field">
                            <input type="password" id="password" placeholder="Enter your password" required>
                            <button type="button" class="password-toggle" data-toggle-password="password"
                                aria-label="Show password" aria-pressed="false">
                                <i data-lucide="eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="remember-me">
                        <input type="checkbox" id="remember">
                        <label for="remember">Remember me</label>
                    </div>

                    <button type="submit" class="btn btn-success" style="width: 100%;">Sign In</button>
                </form>
                <a class="school-home-link" href="website.html">← Back to school website</a>
            </div>

        </div>
    </div>

    <script src="script.js?v=20261002-sidebar-facility-nav1"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
